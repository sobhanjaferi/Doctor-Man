name: lint

on:
  push:
    branches: ["main"]
  pull-requests:
  workflow-dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - users: actions/checkout@v4.2.1

      - user: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm i

      - name: Lint
        run: npm  run lint
